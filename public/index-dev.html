<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nature Code</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;500;600;700&display=swap');

  :root {
    --bg: #f5f3ec;
    --surface: #ffffff;
    --ink: #2a241f;
    --ink-soft: #6b6358;
    --moss: #4a6b3d;
    --moss-light: #6b8e5a;
    --leaf-pale: #e3eddb;
    --line: #ddd5c7;
    --user-bubble: #e8f0e0;
    --shadow: 0 10px 30px -18px rgba(58,47,40,0.45);
    /* גובה שורת הקלט. כל פריט בשורה נגזר ממנו, כדי שהיישור
       יישאר נכון גם אם משנים אותו במקום אחד. */
    --row-h: 52px;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family:'Assistant',system-ui,sans-serif; background:var(--bg);
    color:var(--ink); height:100vh; display:flex; overflow:hidden;
  }

  /* סרגל צד */
  .sidebar {
    width:260px; background:var(--surface); border-inline-end:1px solid var(--line);
    display:flex; flex-direction:column; flex-shrink:0;
  }
  .sidebar-head { padding:18px 20px; border-bottom:1px solid var(--line); }
  .brand { font-size:19px; font-weight:700; color:var(--moss); }
  .version-tag {
    display:inline-block; margin-top:6px; font-size:11px; font-weight:600;
    padding:3px 10px; border-radius:20px; background:var(--leaf-pale); color:var(--moss);
  }
  .new-chat {
    margin:14px 20px; padding:11px; border:none; border-radius:12px;
    background:var(--moss); color:#fff; font-family:inherit; font-size:14px;
    font-weight:600; cursor:pointer; transition:background .18s;
  }
  .new-chat:hover { background:var(--moss-light); }
  .chat-search-wrap { padding:0 20px 10px; }
  .chat-search {
    width:100%; font-family:inherit; font-size:13px; padding:8px 12px;
    border:1px solid var(--line); border-radius:10px; background:var(--bg);
    color:var(--ink); outline:none;
  }
  .chat-search:focus { border-color:var(--moss-light); }
  .chats-list { flex:1; overflow-y:auto; padding:0 12px; }
  .chat-group-label {
    font-size:11px; font-weight:700; letter-spacing:.03em; text-transform:uppercase;
    color:var(--ink-soft); opacity:.65; padding:12px 10px 6px;
  }
  .chat-group-label:first-child { padding-top:2px; }
  .chat-item {
    padding:9px 14px; margin-bottom:3px; border-radius:10px; cursor:pointer;
    color:var(--ink-soft); transition:background .15s;
    display:flex; justify-content:space-between; align-items:center; gap:8px;
  }
  .chat-item:hover { background:var(--leaf-pale); }
  .chat-item.active { background:var(--leaf-pale); color:var(--ink); font-weight:600; }
  .chat-item-main { min-width:0; flex:1; }
  .chat-item-title {
    font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .chat-item-meta {
    font-size:11px; color:var(--ink); opacity:.62; margin-top:2px;
    /* התאריך עצמו נשאר LTR כדי שיום/חודש/שנה לא יתהפכו,
       אבל היישור הולך לפי שפת הממשק — לימין בעברית. */
    direction:ltr; unicode-bidi:embed; text-align:left;
  }
  [dir="rtl"] .chat-item-meta { text-align:right; }
  .chat-item:hover .chat-item-meta, .chat-item.active .chat-item-meta { opacity:.78; }
  /* לוח הגרסאות — שלוש שורות, כל אחת עם תווית ומקור משלה */
  .versions { margin-top:10px; display:flex; flex-direction:column; gap:3px; }
  .ver-row {
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    font-size:10.5px; line-height:1.5;
  }
  .ver-label { color:var(--ink-soft); opacity:.8; white-space:nowrap; }
  .ver-value {
    font-weight:700; color:var(--moss); background:var(--leaf-pale);
    border-radius:8px; padding:1px 7px; direction:ltr; unicode-bidi:embed;
    white-space:nowrap;
  }
  .ver-value.pending { color:var(--ink-soft); background:transparent; font-weight:600; }
  .chat-rename-input {
    width:100%; font-family:inherit; font-size:14px; color:var(--ink);
    padding:2px 6px; border:1px solid var(--moss-light); border-radius:6px;
    background:var(--surface); outline:none; box-sizing:border-box;
  }
  /* תפריט הקשר על כותרת שיחה */
  .ctx-menu {
    position:fixed; z-index:100; display:none; min-width:150px;
    background:var(--surface); border:1px solid var(--line); border-radius:10px;
    box-shadow:var(--shadow); padding:5px; overflow:hidden;
  }
  .ctx-menu.show { display:block; }
  .ctx-item {
    display:block; width:100%; text-align:start; font-family:inherit;
    font-size:13.5px; color:var(--ink); background:transparent; border:none;
    padding:8px 12px; border-radius:7px; cursor:pointer;
  }
  .ctx-item:hover { background:var(--leaf-pale); }
  .ctx-item.danger { color:#b05050; }
  .chat-del { opacity:0; font-size:16px; color:var(--ink-soft); transition:opacity .15s; flex-shrink:0; }
  .chat-item:hover .chat-del { opacity:0.5; }
  .chat-del:hover { opacity:1; color:#b05050; }
  .chats-empty, .chats-error, .chats-loading {
    padding:14px 10px; font-size:13px; color:var(--ink-soft); opacity:.75; line-height:1.6;
  }
  .chats-error { color:#a14a4a; opacity:1; }
  .chats-error button {
    display:block; margin-top:6px; font-family:inherit; font-size:12.5px; font-weight:600;
    color:var(--moss); background:none; border:none; cursor:pointer; padding:0;
  }

  /* אזור ראשי */
  .main { flex:1; display:flex; flex-direction:column; min-width:0; }
  .thread { flex:1; overflow-y:auto; padding:32px clamp(16px,5vw,80px); }
  .thread-wrap { flex:1; position:relative; display:flex; min-height:0; }
  .thread-inner { max-width:760px; margin:0 auto; }

  .empty-state { text-align:center; padding-top:14vh; color:var(--ink-soft); }
  .empty-state h1 { font-size:30px; font-weight:700; color:var(--moss); margin-bottom:12px; }
  .empty-state p { font-size:16px; font-weight:300; max-width:440px; margin:0 auto; }

  .msg { margin-bottom:24px; display:flex; }
  .msg.user { justify-content:flex-start; }
  .msg.assistant { justify-content:flex-start; }
  .bubble {
    max-width:100%; padding:16px 20px; border-radius:16px; font-size:15.5px;
    line-height:1.7; white-space:pre-wrap; word-wrap:break-word;
  }
  /* התקדמות חיה */
  .live-status {
    display:flex; align-items:center; gap:9px; font-size:13.5px;
    color:var(--ink-soft); margin-bottom:9px;
  }
  /* שלוש נקודות שנבנות ונמחקות — סימן חי שהפעולה מתקדמת.
     הרוחב קבוע מראש כדי שהטקסט לא יזוז בכל צעד. */
  /* מצב קפוא — האנימציות נעצרות כשאין עוד מה לסמן. */
  .live-status.static .dots::after { animation:none; content:""; }
  .dots { display:inline-block; width:1.1em; text-align:start; }
  .dots::after {
    content:""; animation:dots 1.6s steps(1,end) infinite;
  }
  @keyframes dots {
    0%   { content:"."; }
    25%  { content:".."; }
    50%  { content:"..."; }
    75%  { content:""; }
    100% { content:"."; }
  }
  /* הקוף — ציור קו אחד. הרקע השחור המקורי הומר לשקיפות מלאה
     והקו ההפוך לשחור, ולכן הוא יושב על כל רקע.
     המסלול: הדמות מתחילה בשמאל ונעה ימינה לאורך כל הרוחב בזמן
     שהאנימציה הפנימית רצה — שתי תנועות בלתי תלויות. */
  .monkey-track {
    position:relative; height:56px; margin:2px 0 10px;
    overflow:hidden; pointer-events:none;
  }
  /*  המיקום מונע מקוד ולא מעיצוב. אנימציית CSS מתחילה מחדש בכל
      פעם שהאלמנט נבנה — והתצוגה נבנית מחדש עשרות פעמים בשנייה
      בזמן כתיבה, ולכן המסע היה קופץ. חישוב לפי זמן שחלף פותר
      את זה לחלוטין ומאפשר גם להחליף חיה בסוף כל מעבר. */
  .monkey {
    position:absolute; top:0; left:0; height:56px; width:auto; display:block;
    will-change:transform;
  }
  .live-dot {
    width:7px; height:7px; border-radius:50%; background:var(--moss);
    animation:pulse 1.3s ease-in-out infinite; flex-shrink:0;
  }
  @keyframes pulse { 0%,100%{opacity:.35;transform:scale(.8)} 50%{opacity:1;transform:scale(1.15)} }
  .live-search {
    font-size:12px; padding:4px 11px; border-radius:14px;
    background:var(--leaf-pale); color:var(--moss); font-weight:500;
    margin:0 0 5px; display:inline-block; animation:fadeIn .25s ease;
  }
  @keyframes fadeIn { from{opacity:0;transform:translateY(-3px)} to{opacity:1;transform:none} }
  .live-think {
    font-size:12.5px; color:var(--ink-soft); opacity:.7; line-height:1.6;
    max-height:88px; overflow:hidden; margin-bottom:8px;
    -webkit-mask-image:linear-gradient(to bottom,#000 40%,transparent);
    mask-image:linear-gradient(to bottom,#000 40%,transparent);
  }

  /* פאנל החשיבה */
  .think {
    margin-bottom:10px; border:1px solid var(--line); border-radius:12px;
    background:#faf8f2; overflow:hidden;
  }
  .think-head {
    padding:9px 14px; font-size:13px; font-weight:600; color:var(--ink-soft);
    cursor:pointer; display:flex; align-items:center; gap:7px; user-select:none;
  }
  .think-head:hover { color:var(--moss); }
  .think-arrow { transition:transform .18s; font-size:10px; }
  .think.open .think-arrow { transform:rotate(90deg); }
  .think-body {
    display:none; padding:0 16px 14px; font-size:13.5px; line-height:1.75;
    color:var(--ink-soft); white-space:pre-wrap; border-top:1px solid var(--line);
    padding-top:12px; max-height:420px; overflow-y:auto;
  }
  .think.open .think-body { display:block; }
  .search-chips { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px; }
  .chip {
    font-size:11.5px; padding:4px 11px; border-radius:14px;
    background:var(--leaf-pale); color:var(--moss); font-weight:500;
    display:inline-flex; align-items:center; gap:5px;
  }
  .bubble a {
    color:var(--moss); text-decoration:underline; text-underline-offset:3px;
    text-decoration-thickness:1.5px; font-weight:600;
  }
  .bubble a:hover { color:var(--moss-light); }
  .msg.user .bubble { background:var(--user-bubble); border:1px solid var(--line); }
  .msg.assistant .bubble { background:var(--surface); border:1px solid var(--line); box-shadow:var(--shadow); }

  .loading-dots { display:inline-flex; gap:5px; padding:4px 0; }
  .loading-dots span {
    width:8px; height:8px; border-radius:50%; background:var(--moss-light);
    animation:bounce 1.3s infinite ease-in-out;
  }
  .loading-dots span:nth-child(2){ animation-delay:.16s; }
  .loading-dots span:nth-child(3){ animation-delay:.32s; }
  @keyframes bounce { 0%,80%,100%{transform:scale(0.6);opacity:.5} 40%{transform:scale(1);opacity:1} }

  /* אזור קלט */
  /* רקע האזור זהה לרקע שמאחורי התשובות, כך שהשדה הלבן בולט
     מתוכו במקום להיבלע בו. */
  .composer { border-top:1px solid var(--line); background:var(--bg); padding:16px clamp(16px,5vw,80px); }
  /* מצב פתיחה — שיחה ריקה. תיבת הכתיבה עולה למרכז המסך במקום
     להיצמד לתחתית, ונפתחת לגובה של חמש שורות. ברגע שנשלחת
     ההודעה הראשונה המסך חוזר לפריסה הרגילה. */
  .main.welcome { justify-content:flex-start; padding-top:20vh; }
  .main.welcome .thread-wrap { flex:0 0 auto; }
  .main.welcome .thread { overflow:visible; padding-bottom:4px; }
  .main.welcome .empty-state { padding-top:0; }
  .main.welcome .composer { border-top:none; background:transparent; padding-top:4px; }
  .composer-inner { max-width:760px; margin:0 auto; }
  .lang-row { display:flex; gap:6px; align-items:center; margin-top:10px; }
  .lang-select {
    font-family:inherit; font-size:12px; font-weight:600; padding:4px 10px;
    border:1px solid var(--line); border-radius:16px; background:transparent;
    color:var(--ink-soft); cursor:pointer;
  }
  .lang-select:hover { border-color:var(--moss-light); }
  /* כל הפריטים באותו גובה בדיוק. כשהתיבה גדלה מעבר לשורה,
     הכפתורים נשארים מיושרים לשורה התחתונה שלה ולא צפים באמצע. */
  .input-row { display:flex; gap:10px; align-items:flex-end; flex-wrap:wrap; }
  /* בורר המודל — יושב בצד ההפוך לכפתור השליחה, ומתהפך אוטומטית ב-RTL */
  .model-group { display:flex; gap:6px; align-items:center; flex-shrink:0; height:var(--row-h); }
  .model-btn {
    font-family:inherit; font-size:12px; font-weight:600; white-space:nowrap;
    height:var(--row-h); padding:0 14px; border:1px solid var(--line); border-radius:16px;
    display:flex; align-items:center; justify-content:center; line-height:1;
    box-sizing:border-box;
    background:#fff; color:var(--ink-soft); cursor:pointer;
    transition:background .18s, border-color .18s, color .18s;
  }
  .model-btn:hover:not(.active):not(:disabled) { border-color:var(--moss-light); color:var(--ink); }
  .model-btn.active { background:var(--moss); border-color:var(--moss); color:#fff; }
  .model-btn:disabled { opacity:.45; cursor:not-allowed; }
  /* במסך צר הבורר עובר לשורה משלו במקום לדחוס את תיבת הכתיבה */
  @media (max-width:640px) { .model-group { flex-basis:100%; } }
  body.no-picker .model-tag { display:none; }
  .model-tag {
    display:inline-block; font-size:11px; font-weight:600; letter-spacing:.02em;
    color:var(--ink-soft); border:1px solid var(--line); border-radius:10px;
    padding:2px 8px; margin-bottom:6px; direction:ltr;
  }
  /* שורה אחת. הגובה נעול לגובה הפריטים האחרים, והריפוד האנכי
     מחושב כך שהטקסט יושב במרכזה. הרקע לבן בכל המצבים. */
  /* פותחת בשורה אחת בדיוק, בלי פס גלילה. גדלה עם הטקסט עד שש
     שורות, ורק אז מופיע פס גלילה. הריפוד והגובה מחושבים יחד
     כדי ששורה אחת תשב בדיוק בגובה הכפתורים. */
  .input-row textarea {
    flex:1; resize:none; font-family:inherit; font-size:15px; line-height:24px;
    padding:13px 16px; border:1px solid var(--line); border-radius:14px;
    background:#fff; color:var(--ink);
    height:var(--row-h); min-height:var(--row-h); max-height:172px;
    overflow-y:hidden; box-sizing:border-box;
  }
  .input-row textarea:focus { outline:none; border-color:var(--moss-light); }
  .send-btn {
    border:none; border-radius:13px; background:var(--moss); color:#fff;
    width:var(--row-h); height:var(--row-h); font-size:20px; cursor:pointer; flex-shrink:0;
    display:flex; align-items:center; justify-content:center; line-height:1;
    padding:0; box-sizing:border-box;
    transition:background .18s;
  }
  .send-btn:hover:not(:disabled) { background:var(--moss-light); }
  .send-btn:disabled { opacity:.5; cursor:not-allowed; }
  /* כפתור חזרה לתחתית — מופיע רק כשהגלילה האוטומטית מושהית */
  .resume-scroll {
    position:absolute; bottom:18px; left:50%; transform:translateX(-50%);
    z-index:5; display:none; align-items:center; gap:8px;
    font-family:inherit; font-size:12.5px; font-weight:600;
    padding:9px 16px; border:1px solid var(--moss); border-radius:20px;
    background:var(--moss); color:#fff;
    box-shadow:var(--shadow); cursor:pointer;
  }
  .resume-scroll.show { display:flex; }
  .resume-scroll:hover { background:var(--moss-light); border-color:var(--moss-light); }
  .resume-dot {
    width:7px; height:7px; border-radius:50%; background:#fff;
    animation:pulse 1.4s infinite ease-in-out; flex-shrink:0;
  }
  .resume-arrow { font-size:13px; opacity:.9; }
  .error-box {
    background:#f3dede; border:1px solid #d9a0a0; color:#a14a4a;
    padding:12px 16px; border-radius:12px; font-size:14px; margin-bottom:14px;
  }
</style>
</head>
<body>
  <aside class="sidebar">
    <div class="sidebar-head">
      <div class="brand" id="brandLabel">Nature Code</div>
      <div class="versions" id="versions"></div>
      <div class="lang-row">
        <select class="lang-select" id="langSelect" onchange="setLang(this.value)"></select>
      </div>
    </div>
    <button class="new-chat" id="newChatBtn" onclick="newChat()">+ New chat</button>
    <div class="chat-search-wrap">
      <input class="chat-search" id="chatSearch" oninput="renderChatsList()" placeholder="">
    </div>
    <div class="chats-list" id="chatsList"></div>
  </aside>

  <main class="main">
    <div class="thread-wrap">
      <div class="thread" id="thread">
        <div class="thread-inner" id="threadInner"></div>
      </div>
      <button class="resume-scroll" id="resumeScroll" onclick="resumeAutoScroll()">
        <span class="resume-dot"></span>
        <span id="resumeScrollLabel">Back to latest</span>
        <span class="resume-arrow">&#8595;</span>
      </button>
    </div>
    <div class="composer">
      <div class="composer-inner">
        <div id="errorSlot"></div>
        <div class="input-row">
          <div class="model-group" id="modelGroup"></div>
          <textarea id="input" rows="1"></textarea>
          <button class="send-btn" id="sendBtn" onclick="send()">↑</button>
        </div>
      </div>
    </div>
  </main>

  <div class="ctx-menu" id="chatMenu"></div>

<script>
  //  בורר המודל. הבחירה חיה לשיחה הנוכחית בלבד ואינה נשמרת —
  //  שיחה חדשה נפתחת תמיד בברירת המחדל.
  const MODELS = [
    { id: "claude-fable-5",  label: "Fable 5"  },
    { id: "claude-opus-5",   label: "Opus 5"   },
    { id: "claude-sonnet-5", label: "Sonnet 5" },
  ];
  const DEFAULT_MODEL_ID = "claude-opus-5";
  let MODEL = DEFAULT_MODEL_ID;

  const VARIANT = "live";

  // ----- גרסאות -----
  //  גרסת האתר מוגדרת כאן, בקובץ שהיא מתארת. העלה אותה כשאתה
  //  משנה את הדף. שתי האחרות נמשכות מהשרת בזמן ריצה, ולכן
  //  אינן יכולות להציג מספר ישן בטעות.
  const SITE_VERSION = "7.1-dev";

  //  ההבדל היחיד בין index.html ל-index-dev.html.
  //  false — ללא בורר מודל; המנוע רץ תמיד בברירת המחדל.
  //  true  — עם בורר מודל, לשימוש פנימי.
  const SHOW_MODEL_PICKER = true;

  let versions = { site: SITE_VERSION, engine: null, knowledge: null };

  function renderVersions() {
    const el = document.getElementById("versions");
    if (!el) return;
    const t = T();
    const rows = [
      [t.verSite,      versions.site],
      [t.verEngine,    versions.engine],
      [t.verKnowledge, versions.knowledge],
    ];
    el.innerHTML = rows.map(([label, value]) =>
      `<div class="ver-row"><span class="ver-label">${escapeHtml(label)}</span>` +
      `<span class="ver-value${value ? "" : " pending"}">${escapeHtml(value || "\u2014")}</span></div>`
    ).join("");
  }

  //  נמשך פעם אחת בטעינה. כשל אינו מפיל דבר — פשוט נשארים מקפים.
  async function loadVersions() {
    try {
      const r = await fetch("/api/version");
      if (!r.ok) return;
      const v = await r.json();
      versions.engine = v.engine || null;
      versions.knowledge = v.knowledge || null;
    } catch (e) {
      console.warn("version fetch failed:", e);
    }
    renderVersions();
  }

  function modelLabel(id) {
    const m = MODELS.find(x => x.id === id);
    return m ? m.label : id;
  }

  function renderModelGroup() {
    const g = document.getElementById("modelGroup");
    if (!g) return;
    if (!SHOW_MODEL_PICKER) { g.innerHTML = ""; g.style.display = "none"; return; }
    g.innerHTML = MODELS.map(m =>
      `<button class="model-btn${m.id === MODEL ? " active" : ""}" data-model="${m.id}"` +
      ` onclick="setModel('${m.id}')">${m.label}</button>`
    ).join("");
  }

  function setModel(id) {
    if (!MODELS.some(m => m.id === id)) return;
    MODEL = id;
    renderModelGroup();
  }

  //  המודל האחרון שענה בשיחה, אם נשמר.
  function lastUsedModel(chat) {
    if (!chat || !chat.messages) return null;
    for (let i = chat.messages.length - 1; i >= 0; i--) {
      const m = chat.messages[i];
      if (m.role === "assistant" && m.model && MODELS.some(x => x.id === m.model)) {
        return m.model;
      }
    }
    return null;
  }

  // ----- שפות -----
  // להוספת שפה: הוסף רשומה אחת כאן. 'dir' מסובב את כל הפריסה אוטומטית.

      stageThinking: "מגבש גישה",
      stageContext: "קורא את האילוצים האמיתיים",
      stageSearching: "בודק מה כבר קיים",
      stageReading: "קורא את מה שנמצא",
      stageMaturity: "בודק כמה זה בשל לייצור",
      stageWriting: "מנסח את התשובה",

      groupWeek: "השבוע", groupOlder: "ישן יותר",
      timeJustNow: "עכשיו", timeMinShort: " דק'", timeHourShort: " שע'", timeDayShort: " ימים",
    },
  };
  const DEFAULT_LANG = "en";
  let lang = DEFAULT_LANG;
  function T() { return I18N[lang]; }

  let currentChat = null;
  let chats = [];

  // ----- אתחול שפה -----
  function buildLangSelect() {
    document.getElementById("langSelect").innerHTML = Object.keys(I18N).map(code =>
      `<option value="${code}" ${code===lang?"selected":""}>${I18N[code].label}</option>`
    ).join("");
  }
  function applyLang() {
    const t = T();
    document.documentElement.lang = lang;
    document.documentElement.dir = t.dir;
    document.title = t.docTitle;
    document.getElementById("brandLabel").textContent = t.brand;
    document.getElementById("newChatBtn").textContent = t.newChat;
    const welcomeNow = !!document.querySelector("main.main.welcome");
    document.getElementById("input").placeholder = welcomeNow ? t.placeholder : "";
    document.getElementById("chatSearch").placeholder = t.chatSearchPlaceholder;
    const rs = document.getElementById("resumeScrollLabel");
    if (rs) rs.textContent = t.resumeScroll;
    renderVersions();
    renderThread(); renderChatsList();
  }
  function setLang(code) {
    if (!I18N[code]) return;
    lang = code;
    try { localStorage.setItem("nc_lang", code); } catch (e) {}
    applyLang();
  }
  function initLang() {
    let saved = null;
    try { saved = localStorage.getItem("nc_lang"); } catch (e) {}
    lang = (saved && I18N[saved]) ? saved : DEFAULT_LANG;
    buildLangSelect(); applyLang();
  }

  let chatsError = null;
  let chatsLoading = true;

  //  טוען את כל היסטוריית השיחות. שגיאה מוצגת בסרגל במקום להיבלע בשקט —
  //  אחרת "אין שיחות" ו"נכשלה הטעינה" נראים אותו דבר למשתמש.
  async function loadChats() {
    chatsLoading = true; chatsError = null; renderChatsList();
    try {
      const r = await fetch("/api/chats?variant=" + VARIANT);
      if (!r.ok) throw new Error("HTTP " + r.status);
      chats = await r.json();
      if (!Array.isArray(chats)) throw new Error("unexpected response shape");
    } catch (e) {
      chats = [];
      chatsError = (e && e.message) ? String(e.message) : "load failed";
      console.error("loadChats failed:", e);
    } finally {
      chatsLoading = false; renderChatsList();
    }
  }

  //  מקבצת שיחות לפי זמן עדכון: היום / אתמול / השבוע / קודם.
  function groupChats(list) {
    const now = new Date();
    const startOfDay = d => new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
    const today = startOfDay(now);
    const yesterday = today - 86400000;
    const weekAgo = today - 6 * 86400000;
    const groups = { today: [], yesterday: [], week: [], older: [] };
    list.forEach(c => {
      const t = c.updated_at ? new Date(c.updated_at).getTime() : 0;
      const day = startOfDay(new Date(t));
      if (day === today) groups.today.push(c);
      else if (day === yesterday) groups.yesterday.push(c);
      else if (day >= weekAgo) groups.week.push(c);
      else groups.older.push(c);
    });
    return groups;
  }

  //  תאריך ושעה מלאים במקום זמן שחלף. "65 ימים" אינו אומר דבר
  //  כשמחפשים שיחה מסוימת; תאריך כן. הפורמט נגזר משפת הממשק,
  //  והשעה בפורמט 24 שעות בשתי השפות.
  function absTime(iso) {
    if (!iso) return "";
    const d = new Date(iso);
    if (isNaN(d.getTime())) return "";
    const t = T();
    try {
      return d.toLocaleString(t.locale || "en-GB", {
        day: "2-digit", month: "2-digit", year: "numeric",
        hour: "2-digit", minute: "2-digit", hour12: false,
      });
    } catch (e) {
      //  אם הסביבה אינה תומכת באפשרויות — נפילה לפורמט ידני,
      //  כדי שהשורה לא תישאר ריקה.
      const p = n => String(n).padStart(2, "0");
      return p(d.getDate()) + "." + p(d.getMonth() + 1) + "." + d.getFullYear() +
             " " + p(d.getHours()) + ":" + p(d.getMinutes());
    }
  }

  // ----- שינוי שם שיחה -----
  //  תפריט הקשר על כותרת בסרגל. נפתח בקליק ימני, נסגר בכל
  //  אינטראקציה אחרת. ממוקם לפי הסמן ונצמד פנימה אם חורג מהמסך.
  function openChatMenu(e, id) {
    e.preventDefault();
    e.stopPropagation();
    const menu = document.getElementById("chatMenu");
    menu.innerHTML =
      `<button class="ctx-item" onclick="startRename('${id}')">${escapeHtml(T().rename)}</button>` +
      `<button class="ctx-item danger" onclick="closeChatMenu();delChat('${id}')">${escapeHtml(T().deleteChat)}</button>`;
    menu.classList.add("show");
    const w = menu.offsetWidth, h = menu.offsetHeight;
    menu.style.left = Math.min(e.clientX, window.innerWidth  - w - 8) + "px";
    menu.style.top  = Math.min(e.clientY, window.innerHeight - h - 8) + "px";
    return false;
  }

  function closeChatMenu() {
    const m = document.getElementById("chatMenu");
    if (m) m.classList.remove("show");
  }

  //  הופך את הכותרת לשדה עריכה, עם הטקסט מסומן כך שאפשר
  //  להקליד מיד. אישור ב-Enter או ביציאה מהשדה; ביטול ב-Escape.
  function startRename(id) {
    closeChatMenu();
    const el = document.getElementById("title_" + id);
    if (!el) return;

    const chat = chats.find(c => c.id === id);
    const original = (chat && chat.title) || "";

    el.textContent = "";
    const inp = document.createElement("input");
    inp.className = "chat-rename-input";
    inp.value = original;
    el.appendChild(inp);
    inp.focus();
    inp.select();

    //  הקליקים בתוך השדה לא אמורים לפתוח את השיחה.
    ["click", "mousedown", "dblclick"].forEach(ev =>
      inp.addEventListener(ev, e => e.stopPropagation()));

    let settled = false;
    async function finish(commit) {
      if (settled) return;
      settled = true;
      const value = inp.value.trim();
      //  שם ריק או ללא שינוי — לא נשמר, והתצוגה חוזרת כמות שהיא.
      if (commit && value && value !== original) {
        await renameChat(id, value);
      } else {
        renderChatsList();
      }
    }

    inp.addEventListener("keydown", e => {
      e.stopPropagation();
      if (e.key === "Enter") { e.preventDefault(); finish(true); }
      else if (e.key === "Escape") { e.preventDefault(); finish(false); }
    });
    inp.addEventListener("blur", () => finish(true));
  }

  //  שומר במסד. השורה מהסרגל מכילה את השיחה המלאה, ולכן אפשר
  //  לשלוח אותה כמו שהיא עם הכותרת החדשה — בלי לטעון אותה שוב.
  async function renameChat(id, title) {
    const chat = chats.find(c => c.id === id);
    if (!chat) return;
    //  touch=false — שינוי שם אינו פעילות בשיחה, ולכן זמן העדכון
    //  אינו משתנה והשיחה נשארת במקומה היחסי ברשימה.
    const payload = Object.assign({}, chat, { title, touch: false });
    try {
      const r = await fetch("/api/chats/" + encodeURIComponent(id), {
        method: "PUT", headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });
      if (!r.ok) throw new Error("HTTP " + r.status);
      chat.title = title;
      if (currentChat && currentChat.id === id) currentChat.title = title;
    } catch (e) {
      console.error("renameChat failed:", e);
    }
    await loadChats();
  }

  function renderChatsList() {
    const el = document.getElementById("chatsList");
    const q = (document.getElementById("chatSearch").value || "").trim().toLowerCase();

    if (chatsLoading) {
      el.innerHTML = `<div class="chats-loading">${T().chatsLoading}</div>`;
      return;
    }
    if (chatsError) {
      el.innerHTML = `<div class="chats-error">${T().chatsError}<button onclick="loadChats()">${T().retry}</button></div>`;
      return;
    }

    const filtered = q
      ? chats.filter(c => (c.title || T().untitled).toLowerCase().includes(q))
      : chats;

    if (filtered.length === 0) {
      el.innerHTML = `<div class="chats-empty">${q ? T().noMatches : T().noChats}</div>`;
      return;
    }

    const groups = groupChats(filtered);
    const sections = [
      ["today", T().groupToday], ["yesterday", T().groupYesterday],
      ["week", T().groupWeek], ["older", T().groupOlder],
    ];

    let html = "";
    sections.forEach(([key, label]) => {
      const items = groups[key];
      if (!items.length) return;
      html += `<div class="chat-group-label">${label}</div>`;
      html += items.map(c => `
        <div class="chat-item ${currentChat && c.id === currentChat.id ? "active" : ""}" onclick="openChat('${c.id}')" oncontextmenu="return openChatMenu(event,'${c.id}')">
          <div class="chat-item-main">
            <div class="chat-item-title" id="title_${c.id}">${escapeHtml(c.title || T().untitled)}</div>
            <div class="chat-item-meta">${absTime(c.created_at || c.updated_at)}</div>
          </div>
          <span class="chat-del" onclick="event.stopPropagation();delChat('${c.id}')">×</span>
        </div>`).join("");
    });
    el.innerHTML = html;
  }

  //  resetModel=false נשלח כששיחה נפתחת מתוך send() — שם המשתמש
  //  כבר בחר מודל, ואיפוס היה דורס את הבחירה שלו רגע לפני השליחה.
  //  כפתור "שיחה חדשה" קורא בלי פרמטר, ולכן כן מאפס.
  function newChat(resetModel) {
    if (resetModel !== false) setModel(DEFAULT_MODEL_ID);
    currentChat = { id: "chat_" + Date.now(), title: null, messages: [], variant: VARIANT };
    renderThread(); renderChatsList();
    document.getElementById("input").focus();
  }
  async function openChat(id) {
    try {
      const r = await fetch("/api/chats/" + encodeURIComponent(id));
      if (!r.ok) throw new Error("HTTP " + r.status);
      currentChat = await r.json();
      //  שיחה קיימת חוזרת עם המודל שענה בה לאחרונה, לא עם ברירת
      //  המחדל. התיוג נשמר בתוך ההודעות, ולכן הוא שורד רענון.
      setModel(lastUsedModel(currentChat) || DEFAULT_MODEL_ID);
      renderThread(); renderChatsList();
    } catch (e) {
      console.error("openChat failed:", e);
      document.getElementById("errorSlot").innerHTML =
        '<div class="error-box">' + T().chatsError + '</div>';
    }
  }
  async function delChat(id) {
    try { await fetch("/api/chats/" + encodeURIComponent(id), { method:"DELETE" }); } catch(e){}
    if (currentChat && currentChat.id === id) { currentChat = null; renderThread(); }
    await loadChats();
  }

  let persistBroken = false;

  //  שומר את השיחה. נקראת מיד כששולחים — לא רק אחרי תשובה — כדי
  //  שהשיחה תופיע בסרגל מיד, ותישמר גם אם הקריאה למנוע נכשלת.
  //  קורא זרם אירועים מהשרת ומעדכן את התצוגה תוך כדי.
  //  מחזיר true אם הצליח, false אם צריך ליפול לקריאה רגילה.
  async function sendStreaming(apiMessages) {
    let response;
    try {
      response = await fetch("/api/ask-stream", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ model: MODEL, messages: apiMessages, lang }),
      });
    } catch (e) { return false; }
    if (!response.ok || !response.body) return false;

    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "", streamErr = null, got = false;

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const parts = buffer.split("\n\n");
      buffer = parts.pop() || "";

      for (const part of parts) {
        const line = part.split("\n").find(l => l.startsWith("data:"));
        if (!line) continue;
        let ev;
        try { ev = JSON.parse(line.slice(5).trim()); } catch (e) { continue; }

        if (ev.type === "status") {
          live.stage = ev.stage;
          if (ev.stage === "writing") jumpToWriting();
          renderThread(true);
        }
        else if (ev.type === "search") { live.searches.push(ev.query); renderThread(true); }
        else if (ev.type === "thinking_delta") { live.thinking += ev.text; renderThread(true); }
        else if (ev.type === "text_delta") {
          got = true;
          //  הטקסט הראשון הוא הסימן האמין שהמנוע כותב.
          if (!live.text) jumpToWriting();
          live.text += ev.text;
          renderThread(true);
        }
        else if (ev.type === "error") { streamErr = ev.message; }
      }
    }

    if (streamErr && !got) throw new Error(streamErr);
    if (!got) return false;

    currentChat.messages.push({
      role: "assistant", content: live.text, model: MODEL,
      thinking: live.thinking, searches: live.searches.slice(),
    });
    return true;
  }

  //  קריאה רגילה, ללא הזרמה — רשת ביטחון.
  async function sendPlain(apiMessages) {
    const response = await fetch("/api/ask", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ model: MODEL, messages: apiMessages, lang }),
    });
    const data = await response.json();
    if (data.error) {
      const em = (typeof data.error === "string")
        ? data.error : (data.error.message || data.error.type || JSON.stringify(data.error));
      throw new Error(em);
    }
    if (!response.ok) throw new Error("HTTP " + response.status);
    const blocks = data.content || [];
    currentChat.messages.push({
      role: "assistant",
      model: MODEL,
      content: blocks.filter(b => b.type === "text").map(b => b.text).join("\n"),
      thinking: blocks.filter(b => b.type === "thinking").map(b => b.thinking || "").join("\n\n").trim(),
      searches: blocks.filter(b => b.type === "server_tool_use" && b.name === "web_search")
                      .map(b => (b.input && b.input.query) || "").filter(Boolean),
    });
  }

  async function persistChat() {
    if (!currentChat) return;
    try {
      const r = await fetch("/api/chats/" + encodeURIComponent(currentChat.id), {
        method:"PUT", headers:{"Content-Type":"application/json"},
        body: JSON.stringify(currentChat),
      });
      if (!r.ok) throw new Error("HTTP " + r.status);
      persistBroken = false;
    } catch (e) {
      //  כשל שמירה נבלע בשקט בגרסאות קודמות — ואז נראה כאילו
      //  ההיסטוריה פשוט לא עובדת, בלי שום רמז לסיבה.
      console.error("persistChat failed:", e);
      if (!persistBroken) {
        persistBroken = true;
        const slot = document.getElementById("errorSlot");
        if (slot && !slot.innerHTML) {
          slot.innerHTML = '<div class="error-box">' + T().saveFailed + '</div>';
        }
      }
    }
  }

  // ----- תצוגת השיחה -----
  //  מצב ההזרמה החי — מה המנוע עושה ברגע זה.
  let live = null;   // { stage, searches:[], thinking:"", text:"" }

  //  ספירלת חתך הזהב. הנתיב מחושב מהנוסחה r = e^(bθ) עם
  //  b = ln(φ)/(π/2), ולכן זו ספירלה לוגריתמית אמיתית ולא קירוב.
  //  שני מקורות: אנימציה בזמן עבודה, ותמונה קפואה כשהיא נעצרת.
  //  זו הדרך היחידה לעצור אנימציה שמגיעה מקובץ.
  // ----- מצעד החיות -----
  //  כל חיה חוצה את הרוחב פעם אחת ואז מפנה את מקומה לבאה.
  //  הסדר מוגרל מחדש בכל שאלה, כדי שלא ייווצר רצף צפוי.
  const ANIMALS = ["monkey", "horse", "lion", "deer", "eagle",
                   "elefent", "snake", "whale", "chita", "manteray"];
  const TRAVEL_S = 16;

  let animalOrder = ANIMALS.slice();
  let animalIdx = 0;
  let travelStart = 0;
  let travelLoop = -1;
  let travelX = 0;
  let travelRAF = null;

  function shuffled(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }

  function animalSrc(stopped) {
    const n = animalOrder[animalIdx % animalOrder.length];
    return "/" + n + (stopped ? "-still" : "") + ".png";
  }

  function monkeyHtml(stopped) {
    return '<div class="monkey-track" id="animalTrack">' +
           '<img class="monkey" alt="" aria-hidden="true"' +
           ' style="transform:translateX(' + travelX.toFixed(1) + 'px)"' +
           ' src="' + animalSrc(stopped) + '"></div>';
  }

  function travelTick() {
    const track = document.getElementById("animalTrack");
    const el = track && track.querySelector(".monkey");
    if (el && track.clientWidth) {
      const t = (performance.now() - travelStart) / (TRAVEL_S * 1000);
      const loop = Math.floor(t);
      //  סוף מעבר — מחליפים לחיה הבאה בסבב.
      if (loop !== travelLoop) {
        if (travelLoop >= 0) {
          animalIdx = (animalIdx + 1) % animalOrder.length;
          el.src = animalSrc(false);
        }
        travelLoop = loop;
      }
      const span = Math.max(0, track.clientWidth - el.offsetWidth);
      travelX = (t - loop) * span;
      el.style.transform = "translateX(" + travelX.toFixed(1) + "px)";
    }
    travelRAF = requestAnimationFrame(travelTick);
  }

  function startTravel() {
    animalOrder = shuffled(ANIMALS);
    animalIdx = 0;
    travelStart = performance.now();
    travelLoop = -1;
    travelX = 0;
    if (travelRAF) cancelAnimationFrame(travelRAF);
    travelRAF = requestAnimationFrame(travelTick);
  }

  function stopTravel() {
    if (travelRAF) cancelAnimationFrame(travelRAF);
    travelRAF = null;
  }

  // ----- ששת השלבים -----
  //  קו זמן בצד הלקוח, כי אין דרך לדעת מראש כמה ייקח כל שלב.
  //  משך כל שלב דומה, בסדר שביקשת. כשהטקסט מתחיל להיכתב בפועל
  //  קופצים מיד לשלב האחרון — כדי שהתצוגה לא תשקר על מה שקורה.
  //  משך משוער לכל שלב. הטיימר מקדם עד שלב חמש בלבד — השלב
  //  השישי נכנס רק כשהטקסט מתחיל להיכתב באמת. בלי ההפרדה הזו
  //  המסך היה מכריז "מנסח תשובה" ואז נתקע שם עשרות שניות.
  const PHASE_MS = [7000, 8000, 10000, 7000];

  //  שני מצבים. בשאלה הראשונה בשיחה מוצג מסלול ששת השלבים,
  //  כי שם המנוע באמת עושה את המחקר הרחב. בכל שאלה אחריה
  //  מוצגת אנימציית חשיבה בלבד — הקשר כבר נבנה, ומסלול שלבים
  //  חוזר היה הצגה ולא דיווח.
  let liveMode = "phases";   // "phases" | "thinking"
  let animStatic = false;    // האם האנימציה כבר נעצרה
  let freezeTimer = null;

  //  אחרי הכניסה לשלב הניסוח נותנים לאנימציה שלוש שניות אחרונות
  //  ואז עוצרים אותה: הטקסט עצמו כבר זורם, והוא הסימן החי.
  const FREEZE_DELAY_MS = 3000;
  //  אם המנוע מתעכב מעבר לצפוי, השלב החמישי נמתח במקום לקפוץ
  //  קדימה — עדיף להישאר על שלב אמיתי מאשר לשקר על ההתקדמות.
  let phaseIdx = 0;
  let phaseTimer = null;

  function phaseLabel() {
    const t = T();
    if (liveMode === "thinking") return animStatic ? t.phase6 : t.thinkingNow;
    return [t.phase1, t.phase2, t.phase3, t.phase4, t.phase5, t.phase6][phaseIdx] || t.phase1;
  }

  function schedulePhase() {
    clearTimeout(phaseTimer);
    if (phaseIdx >= PHASE_MS.length) return;   // עוצר על שלב חמש
    phaseTimer = setTimeout(() => {
      phaseIdx++;
      if (live) renderThread(true);
      schedulePhase();
    }, PHASE_MS[phaseIdx]);
  }

  function startPhases(mode) {
    liveMode = mode || "phases";
    animStatic = false;
    startTravel();
    phaseIdx = 0;
    clearTimeout(freezeTimer);
    freezeTimer = null;
    if (liveMode === "phases") schedulePhase();
  }

  //  הכניסה היחידה לשלב השישי: טקסט אמיתי שמתחיל לזרום.
  function jumpToWriting() {
    clearTimeout(phaseTimer);
    phaseTimer = null;

    if (liveMode === "thinking") {
      //  במצב חשיבה אין מה להציג אחרי שהכתיבה התחילה.
      if (!animStatic) { animStatic = true; stopTravel(); if (live) renderThread(true); }
      return;
    }

    if (phaseIdx !== 5) { phaseIdx = 5; if (live) renderThread(true); }
    if (freezeTimer) return;
    freezeTimer = setTimeout(() => {
      animStatic = true;
      freezeTimer = null;
      stopTravel();
      if (live) renderThread(true);
    }, FREEZE_DELAY_MS);
  }

  function stopPhases() {
    stopTravel();
    clearTimeout(phaseTimer);
    clearTimeout(freezeTimer);
    phaseTimer = null;
    freezeTimer = null;
  }

  function liveHtml() {
    if (!live) return "";
    const st = animStatic ? " static" : "";
    let h = '<div class="live-block' + st + '">' +
            monkeyHtml(animStatic) +
            '<div class="live-status' + st + '"><span>' + escapeHtml(phaseLabel()) +
            '<span class="dots"></span></span></div></div>';
    if (live.searches.length) {
      h += '<div>' + live.searches.map(q =>
        '<div class="live-search">\u2315 ' + escapeHtml(q) + '</div>').join("") + '</div>';
    }
    if (live.thinking && !live.text) {
      const tail = live.thinking.slice(-320);
      h += '<div class="live-think">' + escapeHtml(tail) + '</div>';
    }
    if (live.text) {
      h += '<div class="bubble">' + formatContent(live.text) + '</div>';
    }
    return h;
  }

  //  מצב פתיחה מופעל רק כששיחה ריקה ואין תשובה בכתיבה.
  //  שורת הקלט נושאת טקסט מנחה רק במסך הפתיחה. אחרי שהשיחה
  //  התחילה היא נשארת ריקה — הבקשה לתאר אתגר כבר אינה רלוונטית.
  function setWelcome(on) {
    const m = document.querySelector("main.main");
    if (m) m.classList.toggle("welcome", !!on);
    const inp = document.getElementById("input");
    if (inp) inp.placeholder = on ? T().placeholder : "";
    autoSizeInput();
  }

  function renderThread(loading) {
    const inner = document.getElementById("threadInner");
    if (!currentChat || currentChat.messages.length === 0) {
      if (!loading && !live) {
        setWelcome(true);
        inner.innerHTML = `<div class="empty-state">
          <h1>${T().emptyTitle}</h1>
          <p>${T().emptyText}</p>
        </div>`;
        return;
      }
      inner.innerHTML = "";
    }
    setWelcome(false);
    if (!currentChat) return;
    let html = currentChat.messages.map((m, i) => {
      let extra = "";
      if (m.role === "assistant") {
        //  מי ענה. חשוב כשמחליפים מודל באמצע שיחה — אחרת אי אפשר
        //  לדעת איזו תשובה הגיעה מאיזה מודל.
        if (m.model) {
          extra += `<div class="model-tag">${escapeHtml(modelLabel(m.model))}</div>`;
        }
        if (m.searches && m.searches.length) {
          extra += `<div class="search-chips">` +
            m.searches.map(q => `<span class="chip">\u2315 ${escapeHtml(q)}</span>`).join("") +
            `</div>`;
        }
        if (m.thinking) {
          extra += `<div class="think" id="think${i}">
            <div class="think-head" onclick="document.getElementById('think${i}').classList.toggle('open')">
              <span class="think-arrow">\u25B6</span><span>${T().thinkingLabel}</span>
            </div>
            <div class="think-body">${escapeHtml(m.thinking)}</div>
          </div>`;
        }
      }
      return `<div class="msg ${m.role}">${extra ? `<div style="max-width:100%">${extra}<div class="bubble">${formatContent(m.content)}</div></div>` : `<div class="bubble">${formatContent(m.content)}</div>`}</div>`;
    }).join("");
    if (loading) {
      html += live
        ? `<div class="msg assistant"><div style="max-width:100%">${liveHtml()}</div></div>`
        : `<div class="msg assistant"><div class="bubble"><div class="loading-dots"><span></span><span></span><span></span></div></div></div>`;
    }
    inner.innerHTML = html;
    if (autoScroll) {
      scrollToBottom();
    } else {
      //  אם התוכן התכווץ מתחת למיקום הנוכחי, נוצר רווח ריק.
      //  מצמידים בחזרה לסוף התוכן בלי לחדש מעקב.
      const t = document.getElementById("thread");
      if (t && t.scrollTop > t.scrollHeight - t.clientHeight) {
        t.scrollTop = Math.max(0, t.scrollHeight - t.clientHeight);
      }
    }
    updateResumeButton();
  }

  // ----- גלילה אוטומטית -----
  //  בזמן שהתשובה נכתבת החלון נגלל אוטומטית. ברגע שהמשתמש
  //  גולל בעצמו כלפי מעלה, הגלילה האוטומטית נעצרת — אחרת הטקסט
  //  זז מתחת לעיניים שלו באמצע קריאה. היא חוזרת כשהוא חוזר
  //  לתחתית, בגלילה או בלחיצה על הכפתור הצף.
  let autoScroll = true;

  //  סף סובלנות. גלילה חלקה ועיגול פיקסלים לא מגיעים בדיוק לאפס,
  //  ולכן "בתחתית" הוא טווח ולא נקודה.
  const BOTTOM_SLACK = 60;

  function atBottom(el) {
    return el.scrollHeight - el.scrollTop - el.clientHeight <= BOTTOM_SLACK;
  }

  function scrollToBottom() {
    const t = document.getElementById("thread");
    if (t) t.scrollTop = t.scrollHeight;
  }

  function updateResumeButton() {
    const btn = document.getElementById("resumeScroll");
    if (!btn) return;
    //  הכפתור רלוונטי רק בזמן כתיבה. אחרי שהתשובה הושלמה
    //  אין לאן "לחזור", והוא רק היה מסתיר טקסט.
    btn.classList.toggle("show", !autoScroll && !!live);
  }

  function resumeAutoScroll() {
    autoScroll = true;
    scrollToBottom();
    updateResumeButton();
  }
  function escapeHtml(s) {
    return s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
  }

  //  ממיר טקסט לתצוגה: בורח מ-HTML קודם, ורק אז הופך תחביר מרקדאון
  //  לקישורים לחיצים ולהדגשה. רק http/https מותרים — הגנה מפני הזרקה.
  function formatContent(raw) {
    let out = escapeHtml(raw);
    out = out.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,
      (m, text, url) => `<a href="${url}" target="_blank" rel="noopener noreferrer">${text}</a>`);
    out = out.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    return out;
  }

  // ----- שליחה -----
  async function send() {
    const input = document.getElementById("input");
    const text = input.value.trim();
    if (!text) return;
    if (!currentChat) newChat(false);

    document.getElementById("errorSlot").innerHTML = "";
    currentChat.messages.push({ role:"user", content:text });
    if (!currentChat.title) currentChat.title = text.slice(0, 40);
    input.value = "";
    autoSizeInput();
    //  שליחה חדשה תמיד מחזירה מעקב — המשתמש רוצה לראות את
    //  התשובה שהוא בדיוק ביקש, גם אם גלל למעלה קודם.
    autoScroll = true;
    renderThread(true);
    setSending(true);

    //  שמירה מיידית: השיחה מופיעה בסרגל ברגע שנשלחה, כמו בקלוד,
    //  ולא נעלמת אם המנוע מחזיר שגיאה.
    await persistChat();
    await loadChats();

    // בונים את ההודעות ל-API. קהל היעד קבוע (יזמים) ומוגדר בבסיס הידע.
    const apiMessages = currentChat.messages.map(m => ({
      role: m.role === "user" ? "user" : "assistant",
      content: m.content,
    }));

    live = { stage: "start", searches: [], thinking: "", text: "" };
    //  ההודעה של המשתמש כבר נדחפה, ולכן אורך 1 פירושו שזו
    //  השאלה הראשונה בשיחה.
    startPhases(currentChat.messages.length <= 1 ? "phases" : "thinking");
    renderThread(true);

    try {
      //  הזרמה: הדפדפן מקבל אירועים בזמן אמת ומראה למשתמש
      //  בדיוק מה המנוע עושה כרגע. אם ההזרמה נכשלת — נופלים
      //  חזרה לקריאה הרגילה, כדי שתקלה בהזרמה לא תשבור את המנוע.
      const ok = await sendStreaming(apiMessages);
      if (!ok) await sendPlain(apiMessages);

      stopPhases();
      live = null;
      await persistChat();
      renderThread();
      await loadChats();
    } catch (e) {
      stopPhases();
      live = null;
      renderThread();
      //  שומרים גם בכישלון — שאלת המשתמש לא תיעלם.
      await persistChat();
      const detail = (e && e.message) ? String(e.message) : "";
      document.getElementById("errorSlot").innerHTML =
        '<div class="error-box">' + T().error +
        (detail ? '<div style="margin-top:7px;font-size:12.5px;opacity:.85;direction:ltr;text-align:left">'
                  + escapeHtml(detail) + '</div>' : '') +
        '</div>';
      console.error("Engine request failed:", e);
    } finally {
      setSending(false);
    }
  }
  function setSending(on) {
    document.getElementById("sendBtn").disabled = on;
    //  נועל את הבורר בזמן שהבקשה בדרך, כדי שלא ייווצר מצב שבו
    //  התשובה מתויגת במודל אחר מזה שבאמת ענה.
    document.querySelectorAll(".model-btn").forEach(b => { b.disabled = on; });
  }

  // ----- קלט -----
  const input = document.getElementById("input");

  //  שורה אחת בפתיחה, גדלה עם הטקסט עד שש שורות, ורק אז פס
  //  גלילה. הגלילה נדחפת לתחתית כדי שהשורה שנכתבת כרגע תישאר
  //  מול העיניים — בלי זה הטקסט נכתב מתחת לגבול הנראה.
  const INPUT_MIN_H = 52;    // שורה אחת, זהה ל--row-h
  const INPUT_MAX_H = 172;   // שש שורות

  function autoSizeInput() {
    input.style.height = "auto";
    const needed = input.scrollHeight;
    if (needed > INPUT_MAX_H) {
      input.style.height = INPUT_MAX_H + "px";
      input.style.overflowY = "auto";
      input.scrollTop = input.scrollHeight;
    } else {
      input.style.height = Math.max(INPUT_MIN_H, needed) + "px";
      input.style.overflowY = "hidden";
    }
  }

  input.addEventListener("input", autoSizeInput);
  input.addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
  });

  //  מאזין הגלילה. wheel ו-touchstart תופסים את כוונת המשתמש מיד,
  //  לפני שמיקום הגלילה השתנה — כך שגלילה כלפי מעלה עוצרת את
  //  המעקב גם באמצע זרם מהיר של טקסט.
  (function initScrollWatch() {
    const t = document.getElementById("thread");
    if (!t) return;
    //  אירוע הגלילה רק מחזיר מעקב, לעולם לא מבטל אותו. התוכן
    //  מתכווץ באמצע הזרם — תצוגת החשיבה נעלמת ברגע שהטקסט מתחיל —
    //  והדפדפן משאיר את מיקום הגלילה במקומו. ביטול לפי מיקום היה
    //  מכבה את המעקב מעצמו ומשאיר את הרווח הריק שנראה בצילום.
    t.addEventListener("scroll", () => {
      if (!autoScroll && atBottom(t)) { autoScroll = true; updateResumeButton(); }
    }, { passive: true });
    t.addEventListener("wheel", e => {
      if (e.deltaY < 0 && autoScroll) { autoScroll = false; updateResumeButton(); }
    }, { passive: true });
    t.addEventListener("touchmove", () => {
      if (autoScroll && !atBottom(t)) { autoScroll = false; updateResumeButton(); }
    }, { passive: true });
    //  מקשי גלילה — חץ מעלה, פייג' אפ, בית.
    t.addEventListener("keydown", e => {
      if (["ArrowUp", "PageUp", "Home"].includes(e.key) && autoScroll) {
        autoScroll = false; updateResumeButton();
      }
    });
    t.setAttribute("tabindex", "-1");
  })();

  //  סגירת תפריט ההקשר בכל אינטראקציה אחרת.
  document.addEventListener("click", closeChatMenu);
  document.addEventListener("scroll", closeChatMenu, true);
  window.addEventListener("resize", closeChatMenu);
  document.addEventListener("keydown", e => { if (e.key === "Escape") closeChatMenu(); });
  document.addEventListener("contextmenu", e => {
    //  קליק ימני מחוץ לרשימת השיחות סוגר את התפריט ומחזיר
    //  את תפריט הדפדפן הרגיל.
    if (!e.target.closest(".chat-item")) closeChatMenu();
  });

  if (!SHOW_MODEL_PICKER) document.body.classList.add("no-picker");

  initLang();
  loadVersions();
  renderModelGroup();
  renderThread();
  loadChats();
</script>
</body>
</html>
